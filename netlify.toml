# netlify.toml — deploy config for the Ultimate Job Assistant public companion.
#
# This file lives at the repo root of `ultimate-job-assistant-public`. It pins
# Netlify's deploy settings in code so the UI's Build & deploy panel doesn't
# need to be touched. Edit Netlify settings here, not in the dashboard.

[build]
  # Force the build base to the repo root. This overrides any stale UI value
  # (the first deploy attempt failed because Netlify's UI had Base directory
  # set to "/opt/build", which is the build container's workspace, not a path
  # in the repo). Setting `base` here in code wins over the UI.
  base = "."

  # The public-facing site lives in /website. Netlify uploads everything in
  # this directory as the published site. No build step — it's static HTML +
  # Tailwind CDN, generated by scripts/sync_to_public.py in the canonical repo.
  publish = "website"

  # No build command — the site is fully prebuilt.
  command = ""

# Make `/downloads/ultimate-job-assistant.zip` cacheable but revalidatable so a
# fresh sync is picked up within ~5 minutes without users hammering the file.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Keep the noindex posture explicit at the edge as well as in <meta> tags.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
