# This file is the GitHub Pages deploy workflow for the PUBLIC companion repo.
# It is NOT used by the private repo. The sync_to_public.py script copies this
# file into the public repo at .github/workflows/pages.yml when the website
# is first synced.
#
# The website is plain static HTML + Tailwind CDN — no build step. The workflow
# just uploads the website/ folder as a Pages artifact and deploys it.

name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
